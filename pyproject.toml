[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hitch"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
# The controller (third_party/motion_tracking/sim2real/src) is put on the path by scripts/run;
# its runtime needs are listed here (pyzmq for its VR source, linuxfd for its timer).
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "mujoco==3.10.0", "onnxruntime==1.23.2",
  "openai==3.31.0", "PyYAML==6.0.3", "Pillow==12.3.0", "pyzmq==27.1.0", "linuxfd==1.5", "mink==1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

# The packages and their subpackages, by name.
[tool.setuptools.packages.find]
where = ["src"]
include = [
  "wbc", "wbc.*",                          # the harness: session, planner, skills, link, agent
  "wbc_link_server", "wbc_link_server.*",  # the robot-side processes and the simulator
]

# Data the packages read beside their modules.
[tool.setuptools.package-data]
wbc = ["agent/prompts/*.md", "agent/tasks/*.md", "agent/backends.yaml", "coding/models.json"]

[dependency-groups]
dev = ["ruff==0.17.0"]  # ruff check and ruff format --check over src

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "I"]
ignore = ["E741", "UP007", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/wbc_link_server/scenes/*" = ["E501"]
